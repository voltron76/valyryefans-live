<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ValyryesFans — Exclusive content, behind-the-scenes access, and personal messaging with Valyryes. Subscribe for premium photos, videos, and more.">
  <meta name="theme-color" content="#09090f">
  <title>ValyryesFans — Exclusive Content by Valyryes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23e91e8c'/%3E%3Cstop offset='100%25' style='stop-color:%23ffd700'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='55' font-weight='bold' fill='white' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>

  <!-- Prevent flash of wrong theme -->
  <script>
    (function(){
      var t = localStorage.getItem('vf-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.setAttribute('content', t === 'dark' ? '#09090f' : '#fdf5f8');
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Main Content -->
    <main id="main-content"></main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
