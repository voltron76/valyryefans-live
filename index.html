<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ValyryeFans — Exclusive content, behind-the-scenes access, and personal messaging with Valyrye. Subscribe for premium photos, videos, and more.">
  <meta name="theme-color" content="#09090f">
  <title>ValyryeFans — Exclusive Content by Valyrye</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Prevent flash of wrong theme -->
  <script>
    (function(){
      var t = localStorage.getItem('vf-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.setAttribute('content', t === 'dark' ? '#09090f' : '#fdf5f8');
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Navbar -->
    <nav class="navbar" id="navbar"></nav>

    <!-- Main Content -->
    <main id="main-content"></main>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
